name: Validate Agri-SECA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/engine.test.cjs tests/worker.test.cjs tests/indices.test.cjs
      - run: node tests/integration-indices.cjs
      - run: node tests/parity.cjs
      - run: python build.py
      - run: python tests/static_check.py
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
